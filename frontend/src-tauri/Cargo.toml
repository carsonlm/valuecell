# ValueCell 前端 Tauri 应用 - Cargo.toml 配置文件
# 这个文件定义了 Rust 后端项目的元数据、依赖项和构建配置

# ============================================================================
# 包基本信息 (Package Information)
# ============================================================================
[package]
# 包名称，用于 Cargo 包管理
name = "valuecell"

# 包版本号，遵循语义化版本规范 (major.minor.patch)
version = "0.1.0"

# 包描述
description = "A Tauri App"

# 作者信息
authors = ["valuecell"]

# Rust 版本，使用 2021 版本
edition = "2021"

# 更多键值定义参见：https://doc.rust-lang.org/cargo/reference/manifest.html

# ============================================================================
# 库配置 (Library Configuration)
# ============================================================================
[lib]
# `_lib` 后缀看起来冗余，但它是必要的
# 目的是使库名称唯一，不会与二进制名称冲突
# 这似乎只在 Windows 上是问题，参见：https://github.com/rust-lang/cargo/issues/8519
name = "valuecell_lib"

# crate 类型：
# - staticlib: 静态库，可以链接到其他程序
# - cdylib: 动态库，可以被其他语言调用
# - rlib: Rust 静态库，包含元数据
crate-type = ["staticlib", "cdylib", "rlib"]

# ============================================================================
# 构建依赖项 (Build Dependencies)
# ============================================================================
[build-dependencies]
# tauri-build: Tauri 构建工具，用于生成绑定代码和配置
tauri-build = { version = "2", features = [] }

# ============================================================================
# 运行时依赖项 (Runtime Dependencies)
# ============================================================================
[dependencies]
# ==================== Tauri 核心框架 ====================
# tauri: 桌面应用框架，用于构建跨平台桌面应用
# features: ["devtools"] - 启用开发工具
tauri = { version = "2", features = ["devtools"] }

# ==================== Tauri 插件 ====================
# tauri-plugin-opener: 打开 URL、文件、目录的插件
tauri-plugin-opener = "2"

# tauri-plugin-log: 日志记录插件
tauri-plugin-log = "2"

# tauri-plugin-shell: Shell 命令执行插件
tauri-plugin-shell = "2"

# tauri-plugin-store: 本地存储插件（类似 localStorage）
tauri-plugin-store = "2"

# tauri-plugin-deep-link: 深度链接支持插件
tauri-plugin-deep-link = "2"

# tauri-plugin-os: 操作系统信息插件
tauri-plugin-os = "2"

# tauri-plugin-dialog: 对话框插件（文件选择、消息框等）
tauri-plugin-dialog = "2"

# tauri-plugin-fs: 文件系统操作插件
tauri-plugin-fs = "2"

# ==================== 序列化和反序列化 ====================
# serde: Rust 序列化框架
# features: ["derive"] - 启用派生宏
serde = { version = "1", features = ["derive"] }

# serde_json: JSON 序列化/反序列化
serde_json = "1"

# ==================== 错误处理 ====================
# anyhow: 灵活的错误处理库
anyhow = "1"

# ==================== 日志记录 ====================
# log: Rust 日志门面库
log = "0.4"

# ==================== HTTP 客户端 ====================
# reqwest: Rust HTTP 客户端
# features: ["blocking", "json"] - 启用阻塞模式和 JSON 支持
reqwest = { version = "0.12", features = ["blocking", "json"] }

# ==================== UUID 生成 ====================
# uuid: UUID 生成库
# features: ["v7"] - 启用版本 7 UUID 支持
uuid = { version = "1", features = ["v7"] }

# ============================================================================
# 平台特定依赖项 (Platform-Specific Dependencies)
# ============================================================================
# 这些依赖只在非移动平台（非 Android、非 iOS）上启用
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# ==================== 桌面平台专用插件 ====================
# tauri-plugin-process: 进程管理插件
tauri-plugin-process = "2"

# tauri-plugin-single-instance: 单实例应用支持插件
# features: ["deep-link"] - 启用深度链接支持
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# tauri-plugin-updater: 应用自动更新插件
tauri-plugin-updater = "2"

# ============================================================================
# 使用说明
# ============================================================================
# 1. 构建项目:
#    cargo build          # 调试构建
#    cargo build --release # 发布构建
#
# 2. 运行开发服务器:
#    cargo tauri dev      # 启动 Tauri 开发服务器
#
# 3. 构建应用:
#    cargo tauri build    # 构建桌面应用
#
# 4. 清理构建:
#    cargo clean          # 清理构建缓存
#
# 5. 检查依赖:
#    cargo tree           # 显示依赖树
#    cargo outdated       # 检查过时的依赖
#
# 注意：Tauri 应用需要系统依赖：
# - Windows: WebView2 (通常已预装或自动安装)
# - macOS: WebKit (系统自带)
# - Linux: WebKitGTK 或类似 WebView 库

# ============================================================================
# 各依赖项的主要功能说明
# ============================================================================
# tauri: 核心框架，提供：
#   - 窗口管理
#   - 系统托盘
#   - 菜单栏
#   - 事件系统
#   - 进程间通信
#
# tauri-plugin-*: 各种功能扩展插件：
#   - opener: 打开外部应用/文件
#   - log: 统一日志记录
#   - shell: 执行系统命令
#   - store: 持久化存储
#   - deep-link: 处理自定义协议链接
#   - os: 获取系统信息
#   - dialog: 显示系统对话框
#   - fs: 文件读写操作
#   - process: 进程管理（桌面版）
#   - single-instance: 防止多开（桌面版）
#   - updater: 自动更新（桌面版）
#
# serde/serde_json: 数据序列化，用于：
#   - 前端和后端数据交换
#   - 配置文件读写
#   - 本地存储数据格式
#
# reqwest: HTTP 请求，用于：
#   - 调用后端 API
#   - 获取远程数据
#   - 文件下载
#
# uuid: 唯一标识符生成，用于：
#   - 会话 ID
#   - 文件命名
#   - 数据记录标识
#
# anyhow: 简化错误处理，提供：
#   - 统一的错误类型
#   - 上下文信息
#   - 错误链追踪
#
# log: 日志抽象层，配合 tauri-plugin-log 使用
